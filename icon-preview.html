<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon PNG Preview</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #fdfdfc; color: #111; }
    h1 { font-size: 1.1rem; margin-bottom: 10px; }
    p { margin: 0 0 16px; color: #555; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 14px; }
    .label { font-size: 0.85rem; margin-bottom: 8px; color: #333; }
    .stage { background: repeating-linear-gradient(45deg, #f4f4f4, #f4f4f4 10px, #fafafa 10px, #fafafa 20px); border-radius: 8px; min-height: 180px; display: flex; align-items: center; justify-content: center; overflow: hidden; }

    .cloud-group { position: relative; width: 272px; height: 120px; }
    .cloud2 { position: absolute; width: 186px; left: 60px; top: 0; }
    .cloud1 { position: absolute; width: 144px; left: 0; top: 70px; }
    .cloud3 { position: absolute; width: 110px; left: 182px; top: 60px; }

    .blackboard { width: 392px; max-width: 100%; }
    .shelf { width: 418px; max-width: 100%; }
    .books { width: 272px; max-width: 100%; }
    .tv { width: 552px; max-width: 100%; }
  </style>
</head>
<body>
  <h1>PNG Asset Preview (Homepage Mapping)</h1>
  <p>These are the newly supplied PNGs loaded at your homepage target widths.</p>

  <div class="grid">
    <div class="card">
      <div class="label">Cloud group: <code>Cloud01/02/03 1.png</code></div>
      <div class="stage">
        <div class="cloud-group">
          <img src="images/icons/Cloud02 1.png" class="cloud2" alt="">
          <img src="images/icons/Cloud01 1.png" class="cloud1" alt="">
          <img src="images/icons/Cloud03 1.png" class="cloud3" alt="">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="label">Blackboard: <code>BlackBoard02 1.png</code></div>
      <div class="stage">
        <img src="images/icons/BlackBoard02 1.png" class="blackboard" alt="">
      </div>
    </div>

    <div class="card">
      <div class="label">Shelf: <code>Shelf 1.png</code></div>
      <div class="stage">
        <img src="images/icons/Shelf 1.png" class="shelf" alt="">
      </div>
    </div>

    <div class="card">
      <div class="label">Books: <code>Book_Articles_Influence 1.png</code></div>
      <div class="stage">
        <img src="images/icons/Book_Articles_Influence 1.png" class="books" alt="">
      </div>
    </div>

    <div class="card">
      <div class="label">TV shell: <code>TVGreen_on 1.png</code></div>
      <div class="stage">
        <img src="images/icons/TVGreen_on 1.png" class="tv" alt="">
      </div>
    </div>
  </div>
</body>
</html>
