<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password required — Lesley Rooney</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/tokens.css?v=1">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* tokens provided by tokens.css */
    body {
      font-family: var(--serif);
      font-weight: 300;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card { max-width: 480px; width: 100%; }
    .eyebrow {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-light);
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(1.6rem, 4vw, 2rem);
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    p {
      font-size: 0.95rem;
      color: var(--ink-mid);
      margin-bottom: 32px;
      line-height: 1.75;
    }

    /* ── CHARACTER BOXES ── */
    .char-inputs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      justify-content: flex-start;
    }
    .char-box {
      width: 42px;
      height: 52px;
      border: 1.5px solid var(--rule);
      border-radius: 12px;
      background: var(--paper);
      font-size: 1.3rem;
      font-weight: 500;
      font-family: var(--serif);
      text-align: center;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
      caret-color: transparent;
      -webkit-user-select: none;
    }
    .char-box:focus {
      border-color: var(--blue);
      border-width: 2px;
      background: var(--paper);
    }
    .char-box.has-value {
      background: var(--paper);
    }
    .char-box.error-state {
      border-color: var(--red);
      border-width: 2px;
    }

    .error {
      color: var(--red);
      font-size: 0.82rem;
      margin-bottom: 12px;
      display: none;
      font-weight: 400;
    }
    .error.visible { display: block; }

    button {
      width: 100%;
      padding: 14px;
      background: var(--ink);
      color: var(--paper);
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: var(--serif);
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 4px;
    }
    button:hover { opacity: 0.85; }

    .divider {
      border: none;
      border-top: 1px solid var(--rule);
      margin: 32px 0;
    }
    .back-to-work-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 48px;
      font-family: var(--serif);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--color-blue);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .back-to-work-link .link-text { text-decoration: underline; text-underline-offset: 3px; }
    .back-to-work-link:hover { opacity: 0.75; }
    .back-to-work-arrow { display: inline-block; transition: transform 0.25s ease; }
    .back-to-work-link:hover .back-to-work-arrow { transform: translateX(-10px); }

    /* ── ENTRANCE ANIMATION ── */
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .intro-text {
      opacity: 0;
      animation: slideDown 0.45s ease-out 0.1s forwards;
    }
    .char-inputs {
      opacity: 0;
      animation: slideDown 0.45s ease-out 0.3s forwards;
    }
    button[type="submit"] {
      opacity: 0;
      animation: slideDown 0.45s ease-out 0.5s forwards;
    }


    /* ── CARET ── */
    .char-wrap { position: relative; flex-shrink: 0; }
    .pw-caret {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 2px;
      height: 22px;
      background: var(--color-link);
      border-radius: 2px;
      pointer-events: none;
    }

    #wts_aff,
    [id^="wts"],
    [id*="webstat"],
    [id*="web-stat"],
    [class*="wts"],
    [src*="ardalio"] { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Lesley Rooney - Designer</p>
    <h1>Password required</h1>
    <p class="intro-text">Hey, this case study is restricted but reach out and I'll share the magic word. It's not case sensitive</p>
    <form method="POST" action="/check-password" id="pwForm">
      <input type="hidden" name="dest" id="dest">
      <input type="hidden" name="code" id="codeValue">

      <div class="char-inputs" id="charInputs">
        <div class="char-wrap"><input type="text" class="char-box" maxlength="1" autocomplete="off" inputmode="text" spellcheck="false" aria-label="Character 1"></div>
        <div class="char-wrap"><input type="text" class="char-box" maxlength="1" autocomplete="off" inputmode="text" spellcheck="false" aria-label="Character 2"></div>
        <div class="char-wrap"><input type="text" class="char-box" maxlength="1" autocomplete="off" inputmode="text" spellcheck="false" aria-label="Character 3"></div>
        <div class="char-wrap"><input type="text" class="char-box" maxlength="1" autocomplete="off" inputmode="text" spellcheck="false" aria-label="Character 4"></div>
        <div class="char-wrap"><input type="text" class="char-box" maxlength="1" autocomplete="off" inputmode="text" spellcheck="false" aria-label="Character 5"></div>
        <div class="char-wrap"><input type="text" class="char-box" maxlength="1" autocomplete="off" inputmode="text" spellcheck="false" aria-label="Character 6"></div>
        <div class="char-wrap"><input type="text" class="char-box" maxlength="1" autocomplete="off" inputmode="text" spellcheck="false" aria-label="Character 7"></div>
        <div class="char-wrap"><input type="text" class="char-box" maxlength="1" autocomplete="off" inputmode="text" spellcheck="false" aria-label="Character 8"></div>
        <div class="char-wrap"><input type="text" class="char-box" maxlength="1" autocomplete="off" inputmode="text" spellcheck="false" aria-label="Character 9"></div>
        <div class="char-wrap"><input type="text" class="char-box" maxlength="1" autocomplete="off" inputmode="text" spellcheck="false" aria-label="Character 10"></div>
      </div>

      <p class="error" id="error">Incorrect code — try again, or get in touch.</p>
      <button type="submit">View case study &rarr;</button>
    </form>

    <a href="/" class="back-to-work-link"><span class="back-to-work-arrow">←</span> <span class="link-text">Back to work</span></a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('dest').value = params.get('dest') || '/';

    const boxes = Array.from(document.querySelectorAll('.char-box'));
    const errorEl = document.getElementById('error');
    const form = document.getElementById('pwForm');
    const realValues = new Array(boxes.length).fill('');
    const maskTimers = new Array(boxes.length).fill(null);

    // ── BLINKING CARET ──
    const caret = document.createElement('div');
    caret.className = 'pw-caret';
    let caretTween = null;
    let blurTimer = null;

    function showCaret(box) {
      clearTimeout(blurTimer);  // cancel any pending hide (focus moved to another box)
      if (caret.parentElement) caret.parentElement.removeChild(caret);
      if (caretTween) caretTween.kill();
      box.parentElement.appendChild(caret);
      caretTween = gsap.to(caret, { opacity: 0, duration: 0.5, repeat: -1, yoyo: true, ease: 'none' });
    }

    function hideCaret() {
      blurTimer = setTimeout(function() {  // defer so focus-to-next-box cancels this
        if (caretTween) { caretTween.kill(); caretTween = null; }
        if (caret.parentElement) caret.parentElement.removeChild(caret);
      }, 0);
    }

    function setChar(idx, char) {
      // Store real value
      realValues[idx] = char;
      // Show real char immediately
      boxes[idx].value = char;
      boxes[idx].classList.toggle('has-value', !!char);
      // Clear any existing mask timer
      if (maskTimers[idx]) clearTimeout(maskTimers[idx]);
      if (char) {
        // After 500ms replace with asterisk
        maskTimers[idx] = setTimeout(function() {
          if (realValues[idx]) boxes[idx].value = '*';
        }, 1000);
      }
    }

    function clearChar(idx) {
      if (maskTimers[idx]) clearTimeout(maskTimers[idx]);
      realValues[idx] = '';
      boxes[idx].value = '';
      boxes[idx].classList.remove('has-value');
    }

    // Show error state (focus is called after listeners are attached below)
    const hasError = params.get('error');
    if (hasError) {
      errorEl.classList.add('visible');
      boxes.forEach(b => b.classList.add('error-state'));
    }

    boxes.forEach(function(box, i) {
      box.addEventListener('input', function(e) {
        const raw = box.value;

        // Handle paste of multiple chars
        if (raw.length > 1) {
          const chars = raw.slice(0, boxes.length - i).split('');
          chars.forEach(function(c, j) {
            if (boxes[i + j]) {
              setChar(i + j, c);
              boxes[i + j].classList.remove('error-state');
            }
          });
          const next = i + chars.length;
          if (next < boxes.length) boxes[next].focus();
          else boxes[boxes.length - 1].blur();
          return;
        }

        clearErrors();
        // If user typed over a masked *, extract real new char
        const newChar = raw === '*' ? realValues[i] : raw;
        setChar(i, newChar);
        if (newChar && i < boxes.length - 1) boxes[i + 1].focus();
      });

      box.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace') {
          if (realValues[i]) {
            clearChar(i);
          } else if (i > 0) {
            boxes[i - 1].focus();
            clearChar(i - 1);
          }
          clearErrors();
          e.preventDefault();
        } else if (e.key === 'ArrowLeft') {
          if (i > 0) boxes[i - 1].focus();
          e.preventDefault();
        } else if (e.key === 'ArrowRight') {
          if (i < boxes.length - 1) boxes[i + 1].focus();
          e.preventDefault();
        } else if (e.key === 'Enter') {
          form.requestSubmit ? form.requestSubmit() : form.submit();
        }
      });

      box.addEventListener('focus', function() {
        box.select();
        showCaret(box);
      });

      box.addEventListener('blur', function() {
        hideCaret();
      });
    });

    // Focus first box now that listeners are attached — caret will fire correctly
    boxes[0].focus();

    // Combine real values into hidden input on submit
    form.addEventListener('submit', function(e) {
      document.getElementById('codeValue').value = realValues.join('');
    });

    function clearErrors() {
      errorEl.classList.remove('visible');
      boxes.forEach(b => b.classList.remove('error-state'));
    }
  </script>
